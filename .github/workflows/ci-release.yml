name: CI & Rilis APK MobilJuragan Mobile

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_apk:
        description: "Bangun APK release (artefak workflow)"
        type: boolean
        default: true

jobs:
  ci:
    name: Analisis Flutter
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ambil paket Dart
        run: flutter pub get

      - name: Cek analisis statis
        run: flutter analyze --no-fatal-infos

  release-apk:
    name: Build & Rilis APK Produksi
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_apk)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ambil paket Dart
        run: flutter pub get

      - name: Bangun APK release produksi
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://mobiljuragan.tapakvia.com/api/v1

      - name: Siapkan nama berkas & SHA-256
        id: apk
        run: |
          TAG="${GITHUB_REF_NAME:-manual}"
          OUT="mobiljuragan-${TAG}-release.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$OUT"
          sha256sum "$OUT" > "${OUT}.sha256"
          cat "${OUT}.sha256"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Simpan artefak APK
        uses: actions/upload-artifact@v4
        with:
          name: mobiljuragan-apk-${{ github.ref_name }}
          path: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256

      - name: Terbitkan GitHub Release (khusus tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
